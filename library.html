.rqm label.dl{display:block;margin:.6rem 0 .1rem;font-weight:600;font-size:.9rem}
/* switch user inside the time travel panel */
.ttv{display:flex;flex-direction:column;gap:.4rem;border-top:1px solid color-mix(in srgb,var(--gold) 30%,transparent);padding-top:.6rem}
.ttv .rl{display:flex;flex-wrap:wrap;gap:.3rem}.ttv .rl button{padding:.2rem .6rem;font-size:.72rem;min-width:0}
.ttv .pk{flex:none}.ttv .pk input{padding:.35rem .7rem;font-size:.85rem}.ttp .sg{top:auto;bottom:100%;max-height:260px}
.ttv small b{font-weight:700}
.xb{display:inline-grid!important;place-items:center;padding:0!important;line-height:0!important;font-size:0!important}.xb svg{display:block}.nac{align-self:center}

.cv::after{z-index:2}

/* shine across the pattern lines, now and then */

.shn::after{content:'';position:absolute;top:-10%;bottom:-10%;left:-70%;width:60%;background:linear-gradient(105deg,transparent 0%,rgba(255,236,170,.0) 15%,rgba(255,240,190,.95) 50%,rgba(255,236,170,0) 85%,transparent 100%);will-change:transform;transform:translate3d(0,0,0);animation:shine 8s cubic-bezier(.45,0,.25,1) infinite;animation-delay:var(--sd,0s)}
